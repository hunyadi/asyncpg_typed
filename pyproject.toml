[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncpg_typed"
description = "Type-safe queries for asyncpg"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["asyncpg", "typed", "database-client", "postgres"]
license = "MIT"
authors = [
    { name = "Levente Hunyadi", email = "hunyadi@gmail.com" }
]
maintainers = [
    { name = "Levente Hunyadi", email = "hunyadi@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Utilities",
    "Typing :: Typed"
]
dependencies = [
    "asyncpg >= 0.32",
    "typing-extensions >= 4.16; python_version < '3.15'"
]
dynamic = ["version"]

[project.optional-dependencies]
vector = [
    "asyncpg-vector >= 0.1"
]
dev = [
    "asyncpg-stubs >= 0.32",
    "build >= 1.6",
    "mypy >= 2.4",
    "ruff >= 0.17"
]

[project.urls]
"Homepage" = "https://github.com/hunyadi/asyncpg_typed"
"Source" = "https://github.com/hunyadi/asyncpg_typed"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
show_column_numbers = true
strict = true
strict_bytes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.setuptools]
include-package-data = true
packages = ["asyncpg_typed"]
zip-safe = true

[tool.setuptools.dynamic]
version = { attr = "asyncpg_typed.__version__" }

[tool.setuptools.package-data]
"asyncpg_typed" = ["py.typed"]

[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
preview = true

[tool.ruff.lint]
select = ["B", "D", "DOC", "E", "F", "B", "I", "Q", "W"]
preview = true
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D212", "D401", "B903", "DOC201", "DOC402", "DOC501", "DOC502", "E266"]
extend-select = ["D213", "G004"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
